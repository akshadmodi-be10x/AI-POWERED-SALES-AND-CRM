{q:"On average, how much of a salesperson's day is spent ACTUALLY selling?",o:["About 70%","About 50%","About 30%","About 90%"],a:2,e:"Only ~30%. The other 70% — research, writing, admin, chasing — is exactly what AI takes over."},
{q:"A 'pipeline' in sales means…",o:["Your internet connection to clients","Every deal you're working, organised by stage","A list of people who already bought","A WhatsApp broadcast list"],a:1,e:"Pipeline = all your deals, stage by stage: Leads → Contacted → Meeting → Proposal → Won."},
{q:"You need facts and fresh news about a prospect company, with sources. Best tool?",o:["ChatGPT","HubSpot","Perplexity","Gemini"],a:2,e:"Perplexity searches the LIVE web and answers with clickable sources — the researcher of your team."},
{q:"At a trade expo, 'CraftCrate Gifting' collects 30 visiting cards. Fastest way to turn them into lead data?",o:["Type them into Excel on Sunday","Photograph each card and let Gemini extract the details","Staple them into a diary","Ask the receptionist to call each one"],a:1,e:"Gemini reads photos — card in, structured name/role/email/phone out. The drawer is retired."},
{q:"Which email subject line is most likely to get OPENED?",o:["Business Proposal","Regarding Partnership Opportunity","Quick thought on your 3 new outlets","Greetings of the day!!"],a:2,e:"Specific + curious + about THEIR world wins. 'Business Proposal' is a delete button."},
{q:"The 'style sample trick' in ChatGPT means…",o:["Asking for 10 samples and picking one","Pasting one of YOUR old emails first so it learns your tone","Using fancy English words","Copying a template from the internet"],a:1,e:"Show the AI your own writing first — then everything it drafts sounds like you, not a robot."},
{q:"Most deals need how many follow-up touches — and where do most people stop?",o:["2 needed, people stop at 1","5+ needed, people stop at 2","10 needed, people stop at 9","1 is enough if the email is good"],a:1,e:"80% of deals need 5+ touches; most people quit after 2. That gap is where the money hides."},
{q:"A long, careful job — a full proposal or a 5-touch follow-up sequence. Which tool is the best fit?",o:["Claude","Perplexity","HubSpot","A longer ChatGPT prompt is the only way"],a:0,e:"Rule of thumb: quick & chatty → ChatGPT; long & careful & important → Claude."},
{q:"A lead replied: 'Budget approved — can you deliver by the 20th?' They are…",o:["Cold — too pushy","Warm — wait a week to look busy","Hot — call them TODAY","A spam message"],a:2,e:"Budget + deadline = hot. Hot leads get your Monday morning, immediately."},
{q:"What is a CRM, in plain words?",o:["A paid ads platform","One organised home for every lead, deal and conversation","Software only big companies can afford","A type of email template"],a:1,e:"Customer Relationship Management = one home for your pipeline. HubSpot's free plan is where we start — live, in the session."}];
